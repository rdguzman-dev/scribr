[project]
name = "scribr"
version = "0.1.0"
description = "Automated music transcription for quantized monophonic audio."
readme = "README.md"
authors = [
    { name = "Ricardo D. Guzman", email = "rdguzman.dev@gmail.com" },
    { name = "Sharayh Badar", email = "sharayhbadar@gmail.com"}
]
requires-python = ">=3.13"
dependencies = [
    "mido>=1.3.3",
    "mir-eval>=0.8.2",
    "numpy>=2.5.3",
    "pyfluidsynth>=1.4.0",
    "tfrecord[torch]>=1.14.6",
]

[project.scripts]
scribr = "scribr:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: requires a system FluidSynth install and a SoundFont (set SCRIBR_SOUNDFONT)",
]
